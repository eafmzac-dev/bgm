<svg viewBox="0 0 460 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bachillerato General Militarizado Zacatecas">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e393b" />
      <stop offset="50%" stop-color="#142c2e" />
      <stop offset="100%" stop-color="#0c1d1f" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Laurel Wreath Left -->
    <path d="M 28 85 C 22 70 24 50 35 35 C 38 42 36 55 42 62 C 34 50 38 35 48 24 C 49 32 46 45 52 52 C 45 40 50 25 60 16 C 59 26 56 38 60 46" stroke="url(#silverGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <!-- Laurel Wreath Right -->
    <path d="M 112 85 C 118 70 116 50 105 35 C 102 42 104 55 98 62 C 106 50 102 35 92 24 C 91 32 94 45 88 52 C 95 40 90 25 80 16 C 81 26 84 38 80 46" stroke="url(#silverGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Outer Shield Border (Silver) -->
    <path d="M 38 20 L 102 20 C 102 20 106 72 70 106 C 34 72 38 20 38 20 Z" fill="url(#silverGrad)" stroke="#475569" stroke-width="1.5" />
    <!-- Inner Shield (Dark Teal) -->
    <path d="M 42 24 L 98 24 C 98 24 101 68 70 99 C 39 68 42 24 42 24 Z" fill="url(#shieldBg)" stroke="#0f172a" stroke-width="1" />

    <!-- Crossed Swords -->
    <line x1="46" y1="36" x2="94" y2="84" stroke="white" stroke-width="2.8" stroke-linecap="round" />
    <line x1="42" y1="42" x2="52" y2="32" stroke="url(#silverGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="44" cy="34" r="2" fill="white" />

    <line x1="94" y1="36" x2="46" y2="84" stroke="white" stroke-width="2.8" stroke-linecap="round" />
    <line x1="88" y1="32" x2="98" y2="42" stroke="url(#silverGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="96" cy="34" r="2" fill="white" />

    <!-- La Bufa Hill and Cross -->
    <path d="M 58 35 C 64 30 76 30 82 35 Z" fill="white" opacity="0.95" />
    <line x1="70" y1="28" x2="70" y2="33" stroke="white" stroke-width="1.5" stroke-linecap="round" />
    <line x1="68" y1="30" x2="72" y2="30" stroke="white" stroke-width="1.5" stroke-linecap="round" />

    <!-- Open Book -->
    <path d="M 46 54 Q 50 52 54 55 L 54 62 Q 50 59 46 61 Z" fill="white" stroke="#334155" stroke-width="0.8" />
    <path d="M 54 55 Q 58 52 62 54 L 62 61 Q 58 59 54 62 Z" fill="white" stroke="#334155" stroke-width="0.8" />

    <!-- Crown -->
    <path d="M 78 61 L 80 54 L 84 57 L 88 53 L 92 57 L 96 54 L 98 61 Z" fill="white" stroke="#334155" stroke-width="0.8" />
    <rect x="79" y="61" width="18" height="2" fill="white" rx="0.5" />

    <!-- Zacatecas Silhouette -->
    <path d="M 66 75 C 68 73 73 74 74 77 C 76 79 73 83 71 85 C 69 84 66 82 66 79 Z" fill="white" opacity="0.9" />

    <!-- Banner Ribbon -->
    <path d="M 22 108 L 38 98 L 102 98 L 118 108 L 110 115 L 70 108 L 30 115 Z" fill="url(#ribbonGrad)" stroke="#64748b" stroke-width="1" />
    <text x="70" y="108" text-anchor="middle" font-size="7.5" font-weight="900" font-family="Georgia, serif" fill="#1e293b" letter-spacing="2.5">ZACATECAS</text>
  </g>

  <!-- Typography -->
  <g transform="translate(145, 26)">
    <text x="0" y="28" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="26" font-weight="900" fill="#1e293b" letter-spacing="2">BACHILLERATO</text>
    <text x="0" y="58" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="26" font-weight="900" fill="#1e293b" letter-spacing="2">GENERAL</text>
    <text x="0" y="88" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="22" font-weight="900" fill="#1e293b" letter-spacing="1">MULTIDISCIPLINARIO</text>
  </g>
</svg>
